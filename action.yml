name: Claude PR Reviewer
description: Reviews every pull request with Claude and posts inline comments on real problems.
branding:
  icon: eye
  color: orange

inputs:
  anthropic_api_key:
    description: Anthropic API key (store it as a repository secret)
    required: true
  github_token:
    description: Token used to read the diff and post the review
    default: ${{ github.token }}
  model:
    description: Claude model to use
    default: claude-opus-5-5
  ignore:
    description: Comma-separated glob patterns to skip (lockfiles, generated code)
    default: "*.lock,*-lock.json,*.min.js,dist/*"
  max_diff_chars:
    description: Largest diff sent in one review; files beyond it are listed as not reviewed
    default: "200000"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: python -m reviewer.review
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_MAX_DIFF_CHARS: ${{ inputs.max_diff_chars }}
